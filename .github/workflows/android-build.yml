name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Move project files to repository root
        run: |
          if [ -d ".github/workflows/app" ] && [ ! -d "./app" ]; then
            mv ".github/workflows/app" "./app"
          fi
          for f in settings.gradle.kts build.gradle.kts gradle.properties; do
            if [ -f ".github/workflows/$f" ] && [ ! -f "./$f" ]; then
              mv ".github/workflows/$f" "./$f"
            fi
          done
          ls -la

      - name: Prepare Android SDK (best effort, never fails)
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          fi
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1
          fi
          exit 0

      - name: Generate Gradle wrapper and build APK
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizSolver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
