
name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set +e
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          fi

      - name: Move project files to repository root
        run: |
          if [ -d ".github/workflows/app" ] && [ ! -d "./app" ]; then
            mv ".github/workflows/app" "./app"
          fi
          for f in settings.gradle.kts build.gradle.kts gradle.properties; do
            if [ -f ".github/workflows/$f" ] && [ ! -f "./$f" ]; then
              mv ".github/workflows/$f" "./$f"
            fi
          done
          ls -la

      - name: Generate Gradle wrapper and build APK
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizSolver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
